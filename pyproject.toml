[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "ai-legal-document-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "accelerate>=1.13.0",
    "bm25s>=0.3.8",
    "chromadb>=1.5.8",
    "docling>=2.92.0",
    "docling-core>=2.74.1",
    "flagembedding>=1.4.0",
    "ijson>=3.5.0",
    "ipykernel>=7.2.0",
    "langchain>=1.2.15",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.4",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.2",
    "langchain-experimental>=0.4.1",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pillow>=12.2.0",
    "pydantic[email]>=2.13.3",
    "pypdf>=6.10.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.4.1",
    "transformers>=4.51.0",
    "gliner2>=1.3.1",
    "presidio-analyzer>=2.2.362",
    "semantic-router>=0.1.15",
    "pymupdf>=1.27.2.3",
    "fastapi>=0.136.3",
    "passlib>=1.7.4",
    "python-jose>=3.5.0",
    "bcrypt==4.0.1",
    "psycopg2-binary>=2.9.12",
    "sqlacodegen>=4.0.3",
    "alembic>=1.18.4",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "python-magic-bin>=0.4.14",
    "celery>=5.6.3",
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-asyncio==0.64b0",
    "opentelemetry-instrumentation-dbapi==0.64b0",
    "opentelemetry-instrumentation-exceptions==0.64b0",
    "opentelemetry-instrumentation-logging==0.64b0",
    "opentelemetry-instrumentation-sqlite3==0.64b0",
    "opentelemetry-instrumentation-threading==0.64b0",
    "opentelemetry-instrumentation-urllib==0.64b0",
    "opentelemetry-instrumentation-wsgi==0.64b0",
    "opentelemetry-instrumentation-openai-v2>=2.4b0",
    "opentelemetry-instrumentation-aiohttp-client==0.64b0",
    "opentelemetry-instrumentation-aiohttp-server==0.64b0",
    "opentelemetry-instrumentation-celery==0.64b0",
    "opentelemetry-instrumentation-click==0.64b0",
    "opentelemetry-instrumentation-fastapi==0.64b0",
